# options reference (all optional, shown with defaults/examples):
#   TS_SEARCH_PATHS=(~/)                                  default project search roots
#   TS_EXTRA_SEARCH_PATHS=(~/ghq:3 ~/Git:3 ~/.config:2)   added to defaults; number suffix = search depth
#   TS_MAX_DEPTH=2                                        default depth for TS_SEARCH_PATHS
#   TS_SESSION_COMMANDS=(<cmd1> <cmd2>)                   commands for windows beyond the first 10;
#                                                          `tmux-sessionizer -w 0` runs cmd1 in window -t 69
#   TS_LOG=true                                           logs to ~/.local/share/tmux-sessionizer/*.logs
#   TS_LOG_FILE=<file>                                    override the log file path

TS_SEARCH_PATHS=($HOME ~/.config ~/Documents ~/Downloads ~/go/src/github.com/amit152116 )
TS_EXTRA_SEARCH_PATHS=(~/myDisk:2 /:2)
TS_SESSION_COMMANDS=(btop lazygit yazi glow claude claude2 codex codex2 opencode)
TS_SESSION_BASE=20
TS_SESSION_START_IDX=50
TS_SESSION_RANGE=100
TS_LOG=file
# TS_MAX_DEPTH=2

TS_IGNORE_PATHS=(
        "node_modules"
        ".git"
        "target"
        "build"
        "dist"
        ".venv"
        "venv"
        "env"
        "__pycache__"
        ".direnv"
        ".cache"
        "root"

        # ros 2 workspaces
        "install" # workspace install dirs
        "log"     # workspace log dirs
        ".clangd" # C++ language server cache

        # linux virtual filesystems - descending into these hangs the search
        "proc"
        "sys"
        "dev"
        "run"

        # heavy system/OS dirs
        "var" # logs, databases, docker layers (/var/lib/docker)
        "usr" # system binaries/headers/libs (massive)
        "lib"
        "lib32"
        "lib64"
        "libx32"
        "boot"
        "tmp"
        "lost+found"

        # package managers/mounts
        "snap"    # creates many virtual loop mounts
        "flatpak"
        ".var"    # flatpak user data
    )
