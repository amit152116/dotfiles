# Global ruff config — project pyproject.toml/ruff.toml overrides this

line-length = 88
indent-width = 4
target-version = "py312"

[lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes (undefined names, unused imports)
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade (modernize syntax for target-version)
  "B",    # bugbear (common bugs & design issues)
  "C4",   # comprehensions (simplify list/dict/set comprehensions)
  "SIM",  # simplify (redundant code patterns)
  "PERF", # performance anti-patterns
  "PTH",  # prefer pathlib over os.path
  "RUF",  # ruff-specific rules
]
ignore = [
  "E501",   # line too long — formatter handles this
  "B008",   # function call in default arg — common in FastAPI
  "SIM108", # ternary over if-else — subjective
  "PTH123", # open() → Path.open() — too aggressive for scripts
]
preview = true

[lint.per-file-ignores]
"**/__init__.py" = ["F401"]               # re-exports are intentional
"**/test_*.py" = ["N802", "N803", "S101"] # test naming conventions

[lint.isort]
known-first-party = [] # add your package names per-project

[lint.pep8-naming]
classmethod-decorators = [
  "classmethod",
  "pydantic.validator",
  "pydantic.root_validator",
]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
preview = true
